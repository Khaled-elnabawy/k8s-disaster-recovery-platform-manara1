name: Project Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-check:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform Format Check
        run: terraform fmt -recursive infrastructure/terraform
      - name: Show Formatting Changes
        run: git diff -- infrastructure/terraform
      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

  cloudformation-lint:
    name: CloudFormation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: python -m pip install cfn-lint
      - name: Lint regional StackSet template
        run: cfn-lint infrastructure/cloudformation/regional-warm-standby.yaml
      - name: Compile failover Lambda
        run: python -m py_compile infrastructure/lambda/failover.py
