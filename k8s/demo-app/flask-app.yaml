apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-app-code
  namespace: demo-app
data:
  app.py: |
    from flask import Flask, jsonify, request
    import psycopg2
    import os

    app = Flask(__name__)

    def get_connection():
        return psycopg2.connect(
            host="postgres",
            database=os.environ.get("POSTGRES_DB", "appdb"),
            user=os.environ.get("POSTGRES_USER", "admin"),
            password=os.environ.get("POSTGRES_PASSWORD", "admin123"),
        )

    def init_db():
        conn = get_connection()
        cur = conn.cursor()
        cur.execute("CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, name TEXT);")
        conn.commit()
        cur.close()
        conn.close()

    @app.route("/")
    def home():
        return jsonify({"status": "running", "service": "demo-app"})

    @app.route("/users", methods=["GET"])
    def get_users():
        conn = get_connection()
        cur = conn.cursor()
        cur.execute("SELECT id, name FROM users;")
        rows = cur.fetchall()
        cur.close()
        conn.close()
        return jsonify([{"id": r[0], "name": r[1]} for r in rows])

    @app.route("/users", methods=["POST"])
    def add_user():
        data = request.get_json()
        conn = get_connection()
        cur = conn.cursor()
        cur.execute("INSERT INTO users (name) VALUES (%s) RETURNING id;", (data["name"],))
        new_id = cur.fetchone()[0]
        conn.commit()
        cur.close()
        conn.close()
        return jsonify({"id": new_id, "name": data["name"]}), 201

    if __name__ == "__main__":
        init_db()
        app.run(host="0.0.0.0", port=5000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install flask psycopg2-binary && python /app/app.py
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: flask-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app
  namespace: demo-app
spec:
  selector:
    app: flask-app
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
