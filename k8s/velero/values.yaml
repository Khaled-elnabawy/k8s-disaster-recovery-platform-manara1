configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: REPLACE_WITH_TERRAFORM_S3_BUCKET_OUTPUT
      default: true
      config:
        region: eu-central-1
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: eu-central-1

credentials:
  useSecret: false

serviceAccount:
  server:
    create: true
    name: velero
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_WITH_TERRAFORM_VELERO_ROLE_ARN_OUTPUT

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.0
    volumeMounts:
      - mountPath: /target
        name: plugins

# Keep scheduled backups disabled until a manual backup and restore is verified.
schedules:
  daily-demo-app:
    disabled: true
    schedule: "0 2 * * *"
    template:
      ttl: 720h0m0s
      includedNamespaces:
        - demo-app
